# Namespace for the Praxis OpenShift lab, with guardrails:
#   - a ResourceQuota that forbids requesting any GPU in this namespace
#   - a LimitRange so every container gets modest CPU/memory defaults
# The opendatahub.io/dashboard label shows it as a project in the
# OpenShift AI dashboard, where the simulated models appear.
apiVersion: v1
kind: Namespace
metadata:
  name: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
    opendatahub.io/dashboard: "true"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: no-gpus
  namespace: praxis
spec:
  hard:
    requests.nvidia.com/gpu: "0"
    limits.nvidia.com/gpu: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: defaults
  namespace: praxis
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
