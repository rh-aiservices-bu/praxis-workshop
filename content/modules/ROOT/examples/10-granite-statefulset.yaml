apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: granite
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  serviceName: granite
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: granite
  template:
    metadata:
      labels:
        app: granite
        app.kubernetes.io/part-of: praxis-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
          args:
            - --model=granite-3.1-8b-instruct
            - --port=8000
            - --time-to-first-token=150ms
            - --inter-token-latency=20ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
