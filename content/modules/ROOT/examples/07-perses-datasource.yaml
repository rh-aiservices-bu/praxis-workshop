apiVersion: perses.dev/v1alpha2
kind: PersesDatasource
metadata:
  name: praxis-thanos
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  client:
    tls:
      enable: true
      caCert:
        type: file
        certPath: /ca/service-ca.crt
  config:
    default: true
    display:
      name: OpenShift monitoring (Thanos)
    plugin:
      kind: PrometheusDatasource
      spec:
        proxy:
          kind: HTTPProxy
          spec:
            url: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
            secret: praxis-thanos-secret
