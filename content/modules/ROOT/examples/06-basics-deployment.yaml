apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis-basics
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: praxis-basics
  template:
    metadata:
      labels:
        app: praxis-basics
        app.kubernetes.io/part-of: praxis-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: praxis
          image: ghcr.io/praxis-proxy/praxis:0.7.5
          command: ["praxis", "-c", "/etc/praxis-lab/praxis.yaml"]
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: web
              containerPort: 8080
            - name: limited
              containerPort: 8081
            - name: metrics
              containerPort: 9902
          livenessProbe:
            httpGet:
              path: /healthy
              port: metrics
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: metrics
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Mount the directory, not a subPath: ConfigMap updates are then
            # delivered by an atomic symlink swap that the watcher sees.
            - name: config
              mountPath: /etc/praxis-lab
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: praxis-basics-config
