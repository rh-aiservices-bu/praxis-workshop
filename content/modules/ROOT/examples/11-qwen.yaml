apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: qwen
  namespace: praxis
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: praxis-lab
  annotations:
    openshift.io/display-name: qwen3-8b
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: llm-d-sim
      runtime: llm-d-inference-sim
      args:
        - --model=qwen3-8b
        - --time-to-first-token=300ms
        - --inter-token-latency=30ms
