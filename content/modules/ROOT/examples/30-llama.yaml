# Exercise: add a third model while the gateway keeps running.
# Apply this, then add a route and a cluster for it to the praxis-ai
# ConfigMap. No gateway restart is needed. KServe serves it at
# llama-predictor.praxis.svc.cluster.local:8000.
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: llama
  namespace: praxis
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: praxis-lab
  annotations:
    openshift.io/display-name: llama-3.1-8b-instruct
    serving.kserve.io/deploymentMode: RawDeployment
spec:
  predictor:
    minReplicas: 1
    maxReplicas: 1
    model:
      modelFormat:
        name: llm-d-sim
      runtime: llm-d-inference-sim
      args:
        - --model=llama-3.1-8b-instruct
        - --time-to-first-token=500ms
        - --inter-token-latency=40ms
