apiVersion: v1
kind: Service
metadata:
  name: praxis-ai
  namespace: praxis
  labels:
    app: praxis-ai
    app.kubernetes.io/part-of: praxis-lab
spec:
  selector:
    app: praxis-ai
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9902
      targetPort: metrics
