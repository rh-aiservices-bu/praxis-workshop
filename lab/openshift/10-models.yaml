# Simulated models: llm-d-inference-sim, a CPU-only drop-in for vLLM.
# It serves OpenAI /v1/chat/completions, /v1/responses and Anthropic
# /v1/messages, reports token usage, and simulates time-to-first-token and
# per-token latency. No GPU, no model download.
#
#   granite   StatefulSet, 2 pods, headless Service. Each pod has its own DNS
#             name (granite-0.granite..., granite-1.granite...), so Praxis
#             itself load-balances and health-checks each pod.
#   qwen      Deployment + ordinary ClusterIP Service. Praxis sees one
#             address and Kubernetes balances behind it.
#
# POD_NAME makes the simulator return an x-inference-pod response header,
# so you can see which pod answered.
apiVersion: v1
kind: Service
metadata:
  name: granite
  namespace: praxis
  labels:
    app: granite
    app.kubernetes.io/part-of: praxis-lab
spec:
  clusterIP: None
  selector:
    app: granite
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: granite
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  serviceName: granite
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: granite
  template:
    metadata:
      labels:
        app: granite
        app.kubernetes.io/part-of: praxis-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
          args:
            - --model=granite-3.1-8b-instruct
            - --port=8000
            - --time-to-first-token=150ms
            - --inter-token-latency=20ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: qwen
  namespace: praxis
  labels:
    app: qwen
    app.kubernetes.io/part-of: praxis-lab
spec:
  selector:
    app: qwen
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen
  template:
    metadata:
      labels:
        app: qwen
        app.kubernetes.io/part-of: praxis-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
          args:
            - --model=qwen3-8b
            - --port=8000
            - --time-to-first-token=300ms
            - --inter-token-latency=30ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
