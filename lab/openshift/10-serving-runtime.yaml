# ServingRuntime for the llm-d inference simulator, a CPU-only stand-in for
# vLLM. It serves the OpenAI and Anthropic APIs, reports token usage and
# simulates latency, with no GPU and no model download.
#
# Each InferenceService that uses this runtime adds its own --model and
# latency arguments (see 11-models.yaml).
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: llm-d-inference-sim
  namespace: praxis
  labels:
    opendatahub.io/dashboard: "true"
    app.kubernetes.io/part-of: praxis-lab
  annotations:
    openshift.io/display-name: llm-d inference simulator (CPU)
    opendatahub.io/apiProtocol: REST
spec:
  supportedModelFormats:
    - name: llm-d-sim
      autoSelect: true
  multiModel: false
  containers:
    - name: kserve-container
      image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
      args:
        - --port=8000
      env:
        # Makes every response carry an x-inference-pod header naming the pod.
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Never attach a GPU, even on a GPU node.
        - name: NVIDIA_VISIBLE_DEVICES
          value: void
      ports:
        - containerPort: 8000
          protocol: TCP
      readinessProbe:
        httpGet:
          path: /health
          port: 8000
        periodSeconds: 5
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
