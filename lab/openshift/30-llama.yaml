# Exercise: add a third model while the gateway keeps running.
# Apply this, then add a route and a cluster for it to the praxis-ai
# ConfigMap (see README, step 13). No gateway restart is needed.
apiVersion: v1
kind: Service
metadata:
  name: llama
  namespace: praxis
  labels:
    app: llama
    app.kubernetes.io/part-of: praxis-lab
spec:
  selector:
    app: llama
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama
  namespace: praxis
  labels:
    app.kubernetes.io/part-of: praxis-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llama
  template:
    metadata:
      labels:
        app: llama
        app.kubernetes.io/part-of: praxis-lab
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v1.1.0
          args:
            - --model=llama-3.1-8b-instruct
            - --port=8000
            - --time-to-first-token=500ms
            - --inter-token-latency=40ms
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
